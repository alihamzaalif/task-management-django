{% extends "base.html" %}
{% block content %}
    <div class='mx-auto w-1/2 my-9'>
        {% if messages %}
                {% for message in messages %}
                    <div class="px-2 py-1 {% if message.tags == 'successs' %}bg-green-500{% endif %} ">{{message}}</div>
                {% endfor %}
        {% endif %}
        <form method='POST'>
            {% csrf_token %}
            {% comment %} <input type="text" placeholder="Enter your username" name="username">
            <input type="password" placeholder="Enter your password" name="password"> {% endcomment %}
            {{ form }}
            <button class="bg-blue-500 px-2 py-1 rounded text-white mt-3" type="submit">Sign-in</button>
        </form>
    </div>
{% endblock content %}
